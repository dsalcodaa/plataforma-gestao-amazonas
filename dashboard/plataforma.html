<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma de Gestão Governamental — Amazonas (protótipo)</title>
<style>
:root{
  --bg:#f4f3f0; --surface:#fcfcfb; --line:#e3e1dc; --line-soft:#eeece8;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#77756f;
  --accent:#2a78d6; --accent-soft:#cde2fb; --accent-2:#86b6ef; --bar:#2a78d6; --bar-empty:#e3e1dc; --chip:#eeece8;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121211; --surface:#1a1a19; --line:#33332f; --line-soft:#262624;
  --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#97958d;
  --accent:#3987e5; --accent-soft:#184f95; --accent-2:#1c5cab; --bar:#3987e5; --bar-empty:#383835; --chip:#262624;
}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top h1{font-size:16px;margin:0}
header.top .sub{font-size:12px;color:var(--ink-3)}
nav.main{display:flex;gap:2px;flex-wrap:wrap}
nav.main a{padding:7px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none}
nav.main a:hover{background:var(--line-soft)}
nav.main a[aria-current=page]{background:var(--accent);color:#fff}
.perfil{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
textarea{width:100%;min-height:64px;resize:vertical}
select[multiple]{min-height:110px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 11px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.mini{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
main{padding:20px 28px 40px;max-width:1500px}
h2{font-size:19px;margin:0 0 4px}
h3{font-size:14px;margin:22px 0 8px}
.card h3:first-child{margin-top:0}
.lead{color:var(--ink-2);margin:0 0 14px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:12px 0 18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .v{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}
.tile .l{color:var(--ink-2);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px;min-width:0}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.grid-m{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--line);padding:6px 8px;background:var(--surface)}
td{border-bottom:1px solid var(--line-soft);padding:6px 8px;vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--line-soft)}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--chip);color:var(--ink-2);font-size:12px;white-space:nowrap}
.chip.sug{cursor:pointer;border:1px dashed var(--ink-3);background:none}
.chip.sug:hover{border-color:var(--accent);color:var(--accent)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.st i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--ink-3)}
.st.ok i{background:var(--good)} .st.at i{background:var(--warning)} .st.cr i{background:var(--critical)} .st.ex i{background:var(--serious)} .st.pl i{background:var(--accent)}
.muted{color:var(--ink-3)}
.bar{height:6px;background:var(--bar-empty);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--bar);border-radius:3px}
.pbar{display:flex;align-items:center;gap:8px;min-width:120px}
.pbar .bar{flex:1}
.pbar span{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input[type=search]{min-width:240px;flex:1;max-width:380px}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:var(--line-soft);border-radius:8px;margin-bottom:12px;font-size:13px}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0;flex-wrap:wrap}
.subtabs a{padding:8px 12px;color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs a[aria-current=page]{color:var(--ink);border-color:var(--accent);font-weight:600}
.feed{display:flex;flex-direction:column;gap:8px}
.msg{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.msg .cab{font-size:12px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap}
.msg .cab b{color:var(--ink-2)}
.msg.det{border-left:3px solid var(--accent)}
.msg.log{border-style:dashed}
.msg p{margin:4px 0 0;white-space:pre-wrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2)}
.form .full{grid-column:1/-1}
.form .dois{grid-column:span 2}
.orgsel{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-bottom:16px}
.orgsel a{display:block;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);text-decoration:none}
.orgsel a:hover{border-color:var(--accent)}
.orgsel a small{display:block;color:var(--ink-3);font-size:12px}
.tree .vinc td:first-child{padding-left:26px}
.aviso{font-size:12px;color:var(--ink-3)}
.banner{background:var(--line-soft);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--ink-2);margin-bottom:14px}
input.val{width:100px} input.fonte{width:140px} input[type=date]{width:150px}
.metric{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.metric .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.metric .big{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.metric .big small{font-size:13px;font-weight:400;color:var(--ink-2)}
.metric svg{width:100%;height:auto;display:block;margin-top:6px}
.metric form{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.metric form input{width:120px}
svg text{fill:var(--ink-3);font-size:11px}
svg .grid{stroke:var(--line-soft)}
svg .serie{stroke:var(--accent);stroke-width:2;fill:none}
svg .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg .meta{stroke:var(--ink-3);stroke-dasharray:4 4}
.budget .row{display:grid;grid-template-columns:110px 1fr 130px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.budget .track{height:14px;background:var(--bar-empty);border-radius:4px;overflow:hidden}
.budget .track i{display:block;height:100%;border-radius:0 4px 4px 0}
.budget .emp i{background:var(--accent-2)} .budget .pag i{background:var(--accent)} .budget .prev i{background:var(--ink-3)}
.marcos li{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line-soft)}
.marcos ul{list-style:none;margin:0;padding:0}
.marcos .feito{color:var(--ink-3);text-decoration:line-through}
.soprint{display:none}
@media print{
  header.top,.noprint,.subtabs,.btn,.filters,.bulk{display:none!important}
  .soprint{display:block}
  body{background:#fff;color:#000;font-size:12px}
  main{padding:0;max-width:none}
  .card,.tile,.metric{break-inside:avoid;border-color:#ccc}
  .grid2{grid-template-columns:1fr}
  a{color:inherit;text-decoration:none}
}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}.form .dois{grid-column:auto}}
</style>
</head>
<body>
<header class="top">
  <div><h1>Plataforma de Gestão Governamental — Amazonas</h1><div class="sub" id="sub">Protótipo</div></div>
  <nav class="main" id="menu"></nav>
  <div class="perfil"><span>Atuando como</span><select id="perfil" aria-label="Perfil"></select></div>
</header>
<main id="app"></main>
<script src="dados.js"></script>
<script src="orgaos.js"></script>
<script src="municipios.js"></script>
<script src="exemplos.js"></script>
<script src="plataforma.js"></script>
</body>
</html>
